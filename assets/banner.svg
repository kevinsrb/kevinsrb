<svg width="1400" height="430" viewBox="0 0 1400 430" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="40" y1="20" x2="1360" y2="410" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0A0E12"/>
    <stop offset="0.5" stop-color="#090D11"/>
    <stop offset="1" stop-color="#11161B"/>
  </linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FF7A18"/>
    <stop offset="0.55" stop-color="#FF5714"/>
    <stop offset="1" stop-color="#FF3D00"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="12" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#FF5714" fill-opacity=".16"/>
  </pattern>
</defs>

<rect width="1400" height="430" rx="26" fill="url(#bg)"/>
<rect x="1" y="1" width="1398" height="428" rx="25" stroke="#303840"/>
<rect x="920" y="0" width="480" height="430" fill="url(#dots)" opacity=".65"/>

